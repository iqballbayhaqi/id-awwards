<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 50" width="224" height="50" role="img" aria-label="Indonesia Design">

  <!-- Maroon box background -->
  <rect x="0" y="0" width="102" height="50" fill="#7B1A1A"/>

  <!-- "INDONESIA" uppercase yellow text, centered in box -->
  <text
    x="51" y="31"
    font-family="'Century Gothic','Trebuchet MS','Jost','Nunito',sans-serif"
    font-size="12.5"
    font-weight="700"
    fill="#E8C14A"
    text-anchor="middle"
    letter-spacing="2.2"
  >INDONESIA</text>

  <!-- "des" part of "design" -->
  <text
    x="112" y="36"
    font-family="'Century Gothic','Trebuchet MS','Jost','Nunito',sans-serif"
    font-size="22"
    font-weight="300"
    fill="#1a1a1a"
    letter-spacing="0.8"
    id="txt-des"
  >des</text>

  <!-- dotless "i" (U+0131 = ı) so we can place a custom red dot -->
  <text
    x="153" y="36"
    font-family="'Century Gothic','Trebuchet MS','Jost','Nunito',sans-serif"
    font-size="22"
    font-weight="300"
    fill="#1a1a1a"
    letter-spacing="0.8"
  >&#305;</text>

  <!-- "gn" part of "design" -->
  <text
    x="160" y="36"
    font-family="'Century Gothic','Trebuchet MS','Jost','Nunito',sans-serif"
    font-size="22"
    font-weight="300"
    fill="#1a1a1a"
    letter-spacing="0.8"
  >gn</text>

  <!-- Red dot replacing the dot of the 'i' -->
  <circle cx="156" cy="15" r="3.2" fill="#CC0000"/>

</svg>
